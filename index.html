<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GEOGLOWS | Global Water Intelligence</title>
  <meta name="description" content="Access open water intelligence tools for river forecasting, groundwater monitoring, and water sustainability research."/>
  <meta name="theme-color" content="#fbfdfd" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#111a26" media="(prefers-color-scheme: dark)"/>

  <!-- Open Graph -->
  <meta property="og:title" content="GEOGLOWS | Global Water Intelligence"/>
  <meta property="og:description" content="Open-access tools for river forecasting, groundwater monitoring, and water sustainability research."/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="/geoglows-logo.png"/>

  <link rel="icon" type="image/png" href="/favicon.png"/>

  <!-- GEO Brand Book typefaces, self-hosted to match geoglows.org -->
  <link rel="preload" href="/fonts/raleway.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/fonts/opensans.woff2" as="font" type="font/woff2" crossorigin/>

  <!-- Stamp the theme before first paint so the GEO token layer resolves once.
       With no attribute set, tokens.css falls back to prefers-color-scheme. -->
  <script>
    try {
      var stored = localStorage.getItem("theme");
      var dark = stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) {}
  </script>
</head>
<body>
<div id="app">
  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Open Sans','Segoe UI',system-ui,sans-serif;color:#55555a;text-align:center;padding:2rem">
      <p>JavaScript is required to use the GEOGLOWS portal.</p>
    </div>
  </noscript>
</div>
<dialog id="geoglows-disclaimer-modal" style="margin:auto;height:min(90vh,720px)" class="rounded-brand p-0 max-w-2xl w-[calc(100vw-2rem)] overflow-hidden backdrop:bg-geo-navy-deep/60 backdrop:backdrop-blur-sm bg-page border border-line shadow-2xl"></dialog>
<script>
  window.__GEOGLOWS_INITIAL_URL__ = {
    hash: window.location.hash,
    search: window.location.search,
  };
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
