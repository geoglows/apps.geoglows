# Copy to .github/workflows/deploy.yml in an app repo. No edit needed: the path
# comes from the repo's own APP_PATH variable, so moving an app is a settings
# change rather than a commit. Not in workflows/ here, so it never runs here.
#
# Set on the app repository (Settings > Secrets and variables > Actions >
# Variables). It must match the app's path in apps.json, and must be per-repo —
# an organization-level APP_PATH would point every app at the same place:
#
#   variables  APP_PATH, e.g. /rfs or /previews/rfs
#
# Set once at the organization level, so an app repo configures nothing else:
#
#   variables  S3_BUCKET_NAME, CLOUDFRONT_DISTRIBUTION_ID
#   secrets    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#
# Variables resolve in the shared workflow on their own; the secrets arrive via
# `secrets: inherit` below. Give the IAM user only what the deploy needs:
#
#   s3:PutObject, s3:DeleteObject  on arn:aws:s3:::apps-geoglows/*
#   s3:ListBucket                  on arn:aws:s3:::apps-geoglows
#   cloudfront:CreateInvalidation  on the one distribution
#
# DeleteObject is needed because each deploy syncs with --delete, and
# ListBucket is what lets sync see which objects are no longer in the build.
#
# One key shared by every app means any app repo can write to any app's path,
# so keep the org secret restricted to the repos that deploy, and rotate it on
# a schedule and whenever someone with access leaves.

name: Deploy

# Builds this app and publishes it to apps.geoglows
# Needs variables S3_BUCKET_NAME, CLOUDFRONT_DISTRIBUTION_ID, APP_PATH
# Needs secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (default: main)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    uses: geoglows/apps.geoglows/.github/workflows/deploy-app.yml@main
    with:
      app_path: ${{ vars.APP_PATH }}
      ref: ${{ inputs.ref }}
    secrets: inherit
